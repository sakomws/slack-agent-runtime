name: Reusable source security audit

on:
  workflow_call:
    inputs:
      job_id:
        required: true
        type: string
      slack_channel:
        required: true
        type: string
      slack_thread_ts:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      profile:
        required: true
        type: string
      budget:
        required: true
        type: number
      scope:
        required: true
        type: string
      runtime_repository:
        type: string
        default: sakomws/slack-agent-runtime
      runtime_ref:
        type: string
        default: main
    secrets:
      INFERENCE_ROUTER_BASE_URL:
        required: true
      INFERENCE_ROUTER_API_KEY:
        required: true
      INFERENCE_ROUTER_MODEL:
        required: true
      SLACK_CODING_BOT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: slack-security-audit-${{ github.repository }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate dispatch metadata
        env:
          JOB_ID: ${{ inputs.job_id }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SLACK_THREAD_TS: ${{ inputs.slack_thread_ts }}
          PROFILE: ${{ inputs.profile }}
          BUDGET: ${{ inputs.budget }}
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          checks = {
              "job_id": (os.environ["JOB_ID"], r"[a-f0-9]{32}"),
              "slack_channel": (os.environ["SLACK_CHANNEL"], r"[A-Z0-9]{2,32}"),
              "slack_thread_ts": (os.environ["SLACK_THREAD_TS"], r"\d{1,20}\.\d{1,20}"),
          }
          for name, (value, pattern) in checks.items():
              if re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"invalid {name}")
          if os.environ["PROFILE"] not in {"quick", "standard", "deep"}:
              raise SystemExit("invalid profile")
          budget = int(os.environ["BUDGET"])
          if not 8 <= budget <= 64:
              raise SystemExit("invalid budget")
          scope = os.environ["SCOPE"]
          path = PurePosixPath(scope)
          if not scope or len(scope) > 200 or path.is_absolute() or ".." in path.parts:
              raise SystemExit("invalid scope")
          PY

      - name: Notify Slack that audit started
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "🔐 Security audit `${{ inputs.job_id }}` started in `${{ github.repository }}` with `${{ inputs.profile }}` profile."

      - name: Check out target repository without credentials
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ inputs.base_ref }}
          persist-credentials: false

      - name: Record reviewed source
        id: source
        working-directory: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out Slack Agent Runtime without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtime_repository }}
          ref: ${{ inputs.runtime_ref }}
          path: runtime
          persist-credentials: false

      - name: Check out pinned Cloudflare security audit skill
        uses: actions/checkout@v4
        with:
          repository: cloudflare/security-audit-skill
          ref: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
          path: security-audit-skill
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install audit worker
        run: uv sync --project runtime --frozen

      # Only this source-only step receives inference credentials. It has no
      # GitHub or Slack token and exposes no target-code execution tool.
      - name: Run skill-driven source security audit
        env:
          INFERENCE_ROUTER_BASE_URL: ${{ secrets.INFERENCE_ROUTER_BASE_URL }}
          INFERENCE_ROUTER_API_KEY: ${{ secrets.INFERENCE_ROUTER_API_KEY }}
          INFERENCE_ROUTER_MODEL: ${{ secrets.INFERENCE_ROUTER_MODEL }}
        run: |
          uv run --project runtime slack-agent-security-audit \
            --target "$GITHUB_WORKSPACE/target" \
            --skill-dir "$GITHUB_WORKSPACE/security-audit-skill/skills/security-audit" \
            --output-dir "$RUNNER_TEMP/security-audit-output" \
            --result-file "$RUNNER_TEMP/security-audit-result.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "${{ steps.source.outputs.sha }}" \
            --profile "${{ inputs.profile }}" \
            --scope "${{ inputs.scope }}" \
            --max-agents "${{ inputs.budget }}"

      - name: Validate audit artifacts
        env:
          OUTPUT_DIR: ${{ runner.temp }}/security-audit-output
          SKILL_DIR: ${{ github.workspace }}/security-audit-skill/skills/security-audit
        run: |
          node "$SKILL_DIR/validate-findings.cjs" "$OUTPUT_DIR/findings.json"
          node "$SKILL_DIR/validate-coverage-ledger.cjs" "$OUTPUT_DIR/coverage-ledger.json"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          required = {
              "run-metadata.json",
              "architecture.md",
              "coverage-ledger.json",
              "findings.json",
              "REPORT.md",
              "FINDINGS-DETAIL.md",
              "NEEDS-VALIDATION.md",
          }
          if {path.name for path in output.iterdir() if path.is_file()} != required:
              raise SystemExit("audit artifact set is incomplete or unexpected")
          secret_like = re.compile(
              rb"(github_pat_|gh[pousr]_|xox[baprs]-|sk-[A-Za-z0-9_-]{12,})",
              re.IGNORECASE,
          )
          for path in output.iterdir():
              if secret_like.search(path.read_bytes()):
                  raise SystemExit(f"secret-like value found in {path.name}")
          PY

      - name: Add report to workflow summary
        run: cat "$RUNNER_TEMP/security-audit-output/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated security audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ inputs.job_id }}
          path: ${{ runner.temp }}/security-audit-output
          if-no-files-found: error
          retention-days: 30

      - name: Notify Slack of success
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "✅ Security audit `${{ inputs.job_id }}` completed. Download the validated report from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Notify Slack of failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "❌ Security audit `${{ inputs.job_id }}` failed before producing a validated report. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Notify Slack of cancellation
        if: cancelled()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "⚪ Security audit `${{ inputs.job_id }}` was cancelled."
