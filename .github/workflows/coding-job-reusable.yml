name: Reusable Slack coding job

on:
  workflow_call:
    inputs:
      job_id:
        required: true
        type: string
      prompt:
        required: true
        type: string
      slack_channel:
        required: true
        type: string
      slack_thread_ts:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      runtime_repository:
        type: string
        default: sakomws/slack-agent-runtime
      runtime_ref:
        type: string
        default: main
    secrets:
      INFERENCE_ROUTER_BASE_URL:
        required: true
      INFERENCE_ROUTER_API_KEY:
        required: true
      INFERENCE_ROUTER_MODEL:
        required: true
      SLACK_CODING_BOT_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: slack-coding-${{ github.repository }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pull_request_url: ${{ steps.pull_request.outputs.url }}
    steps:
      - name: Validate dispatch metadata
        env:
          JOB_ID: ${{ inputs.job_id }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SLACK_THREAD_TS: ${{ inputs.slack_thread_ts }}
        run: |
          python - <<'PY'
          import os
          import re

          checks = {
              "job_id": (os.environ["JOB_ID"], r"[a-f0-9]{32}"),
              "slack_channel": (os.environ["SLACK_CHANNEL"], r"[A-Z0-9]{2,32}"),
              "slack_thread_ts": (os.environ["SLACK_THREAD_TS"], r"\d{1,20}\.\d{1,20}"),
          }
          for name, (value, pattern) in checks.items():
              if re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"invalid {name}")
          PY

      - name: Notify Slack that work started
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "🛠️ Coding job `${{ inputs.job_id }}` started in `${{ github.repository }}`."

      - name: Check out target repository without credentials
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ inputs.base_ref }}
          persist-credentials: false

      - name: Check out Slack Agent Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runtime_repository }}
          ref: ${{ inputs.runtime_ref }}
          path: runtime
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install coding worker
        run: uv sync --project runtime --frozen

      - name: Materialize prompt outside target checkout
        env:
          CODING_PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "coding-prompt.txt").write_text(
              os.environ["CODING_PROMPT"],
              encoding="utf-8",
          )
          PY

      # Only this step receives inference credentials. It has no GitHub or Slack token.
      - name: Run bounded coding worker
        env:
          INFERENCE_ROUTER_BASE_URL: ${{ secrets.INFERENCE_ROUTER_BASE_URL }}
          INFERENCE_ROUTER_API_KEY: ${{ secrets.INFERENCE_ROUTER_API_KEY }}
          INFERENCE_ROUTER_MODEL: ${{ secrets.INFERENCE_ROUTER_MODEL }}
        run: |
          uv run --project runtime slack-agent-worker \
            --workspace "$GITHUB_WORKSPACE/target" \
            --prompt-file "$RUNNER_TEMP/coding-prompt.txt" \
            --output-file "$RUNNER_TEMP/coding-result.json"

      - name: Verify protected paths and metadata
        env:
          RESULT_FILE: ${{ runner.temp }}/coding-result.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path("target")
          raw_result = Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8")
          if re.search(
              r"(github_pat_|gh[pousr]_|xox[baprs]-|sk-[A-Za-z0-9_-]{12,})",
              raw_result,
              re.IGNORECASE,
          ):
              raise SystemExit("secret-like value found in worker metadata")
          result = json.loads(raw_result)
          changed = set(result["changed_files"])
          protected = {
              name for name in changed
              if any(part.startswith(".env") for part in Path(name).parts)
              or name.startswith((".git/", ".github/workflows/", "secrets/"))
              or Path(name).suffix.lower() in {".key", ".pem", ".p12", ".pfx"}
          }
          if protected:
              raise SystemExit(f"protected paths changed: {sorted(protected)}")
          if not changed:
              raise SystemExit("worker produced no changes")
          subprocess.run(["git", "add", "--intent-to-add", "--all"], cwd=root, check=True)
          subprocess.run(["git", "diff", "--check"], cwd=root, check=True)
          PY

      # GitHub credentials are introduced only after the untrusted coding process exits.
      - name: Commit and push isolated branch
        id: push
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          branch="agent/${JOB_ID}"
          git switch -c "$branch"
          git config user.name "slack-agent-runtime[bot]"
          git config user.email "slack-agent-runtime[bot]@users.noreply.github.com"
          git add --all
          git -c core.hooksPath=/dev/null commit -m "Implement Slack coding request"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pull_request
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE_REF: ${{ inputs.base_ref }}
          RESULT_FILE: ${{ runner.temp }}/coding-result.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8"))
          Path(os.environ["RUNNER_TEMP"], "pr-title.txt").write_text(
              result["pr_title"], encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text(
              result["pr_body"], encoding="utf-8"
          )
          PY
          url="$(gh pr create \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/pr-title.txt")" \
            --body-file "$RUNNER_TEMP/pr-body.md")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of success
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "✅ Coding job completed: ${{ steps.pull_request.outputs.url }}"

      - name: Notify Slack of failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "❌ Coding job `${{ inputs.job_id }}` failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Notify Slack of cancellation
        if: cancelled()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
          payload: |
            channel: ${{ toJSON(inputs.slack_channel) }}
            thread_ts: ${{ toJSON(inputs.slack_thread_ts) }}
            text: "⚪ Coding job `${{ inputs.job_id }}` was cancelled."
