name: Container

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: slack-agent-runtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect runtime user and healthcheck
        run: |
          test "$(docker image inspect slack-agent-runtime:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect slack-agent-runtime:test --format '{{json .Config.Healthcheck}}')" != "null"
